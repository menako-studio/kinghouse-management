# Dependabot configuration
# Keeps npm dependencies current so security patches land early, and groups
# updates weekly to avoid pull-request noise. Security updates are delivered
# automatically regardless of this schedule.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # typescript-eslint does not support TypeScript 7 yet (it breaks `npm run lint`).
      # Stay on the 5.x line until typescript-eslint adds TS 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
